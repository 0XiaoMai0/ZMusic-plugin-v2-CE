plugins {
    alias(libs.plugins.shadow)
}

version = '2.14.0-CE.6'

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.tianscar.javasound:jaad:0.9.4'
    implementation 'de.sciss:jump3r:1.0.5'

    compileOnly libs.bungeecord
    compileOnly libs.velocity

    // Adventure API (Velocity/Paper 使用) - 仅编译时依赖，运行时由平台提供
    compileOnly libs.adventure.api
    compileOnly libs.adventure.text.serializer.legacy

    compileOnly libs.placeholderapi
    compileOnly libs.vault

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation libs.placeholderapi
    testImplementation libs.spigot
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'zmusic.liveTests', System.getProperty('zmusic.liveTests', 'false')
}

shadowJar {
    archiveFileName = 'ZMusic-CE-2.14.0.jar'
    relocate 'com.google.gson', 'me.zhenxin.zmusic.libs.gson'
    relocate 'net.sourceforge.jaad', 'me.zhenxin.zmusic.libs.jaad'
    relocate 'de.sciss.jump3r', 'me.zhenxin.zmusic.libs.jump3r'
}

build {
    dependsOn shadowJar
}

processResources {
    inputs.property "version", project.version

    filesMatching("bungee.yml") {
        expand "version": project.version
    }

    filesMatching("plugin.yml") {
        expand "version": project.version
    }

    filesMatching("velocity-plugin.json") {
        expand "version": project.version
    }
}
